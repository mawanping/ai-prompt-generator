<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <link rel="stylesheet" href="./assets/uni.799234e3.css">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <title>AI提示词生成器</title>
    <script type="module" crossorigin src="./assets/index-BlThJPAy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DYjchcum.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="hit-counter" style="position:fixed;bottom:12px;right:16px;z-index:9999;font-size:12px;color:#999;background:rgba(0,0,0,0.5);padding:4px 10px;border-radius:12px;pointer-events:none">👀 <span id="hit-count">0</span></div>
    <script>
      (function(){var k='ai-prompt-generator-v2';var c=document.getElementById('hit-count');var s=localStorage.getItem('_v_'+k);function u(){fetch('https://api.countapi.xyz/hit/mawanping/'+k).then(function(r){return r.json()}).then(function(d){c.textContent=d.value;localStorage.setItem('_v_'+k,'1')}).catch(function(){var v=parseInt(localStorage.getItem('_cv_'+k)||'0')+1;localStorage.setItem('_cv_'+k,v);c.textContent=v})}if(s){fetch('https://api.countapi.xyz/get/mawanping/'+k).then(function(r){return r.json()}).then(function(d){c.textContent=d.value||'0'}).catch(function(){c.textContent=localStorage.getItem('_cv_'+k)||'0'})}else{u()}})();
    </script>
  </body>
